<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gilded Hush - a stealth heist in three nights</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07080f; display: grid; place-items: center; }
  #game { display: block; image-rendering: auto; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Gilded Hush: sneak a thief past guards and cameras, steal the prize and reach the getaway van"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
